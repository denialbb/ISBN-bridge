; ISBN Bridge client translations — English (fallback language).
; To add a language: copy this file to <code>.ini, translate the values
; (keep the keys and the {1} {2} placeholders), and fill in [meta]
; language_name plus lang_id (primary OS language ID, e.g. 9 English,
; 16 Italian, 12 French, 7 German, 10 Spanish). No code changes needed:
; the client picks up new files on next start and lists them in the
; tray language menu. Save as UTF-8 with BOM or UTF-16 so accented
; characters load correctly (the loader handles both). Newline inside
; a value is `n.

[meta]
language_name = English
lang_id = 9

