[project]
name = "client-linux"
version = "1.1.1"
description = "ISBN Bridge Linux desktop client"
readme = "README.md"
authors = [
    { name = "Daniel Biasiotto", email = "mail@denial.in.net" }
]
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
]

[project.scripts]
client-linux = "client_linux:main"
isbn-bridge-linux = "client_linux:main"
isbn-bridge-client = "client_linux:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
